version: "3.9"

services:
  couchdb:
    image: couchdb:3.4
    container_name: couchgraph-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-changeme_secure_password}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./docker/couchdb/10-single-node.ini:/opt/couchdb/etc/local.d/10-single-node.ini:ro
    networks:
      - couchgraph-internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  couchgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: couchgraph-server
    restart: unless-stopped
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-changeme_secure_password}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-couchgraph}
      PORT: 8080
      PLAYGROUND_ENABLED: ${PLAYGROUND_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - couchgraph-internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.couchgraph.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.couchgraph.entrypoints=websecure"
      - "traefik.http.routers.couchgraph.tls=true"
      - "traefik.http.routers.couchgraph.tls.certresolver=letsencrypt"
      - "traefik.http.services.couchgraph.loadbalancer.server.port=8080"
      - "traefik.http.routers.couchgraph.middlewares=couchgraph-compress"
      - "traefik.http.middlewares.couchgraph-compress.compress=true"

volumes:
  couchdb_data:
    driver: local

networks:
  couchgraph-internal:
    driver: bridge
  dokploy-network:
    external: true
