couchdb:
  url: ${COUCHDB_URL:-http://localhost:5984}
  user: ${COUCHDB_USER:-admin}
  password: ${COUCHDB_PASSWORD:-password}
  database: ${COUCHDB_DATABASE:-couchgraph_movies}

schema:
  core: true            # keep the generic API (document, findDocs, queryView, ...) next to the typed one
  paths:
    - schema/**/*.graphqls

designDocs:
  paths:
    - couchdb/design/*.json
  sync: on-start        # push views when the server starts (or run `couchgraph sync`)

indexes:
  - name: idx_movies_genre_rating
    fields: [type, genres, rating, year]
  - name: idx_movies_director_year
    fields: [type, director, year]
  - name: idx_movies_director_id
    fields: [type, director_id]

server:
  port: ${PORT:-8080}
  playground: true
  readOnly: false       # allow mutations in playground

