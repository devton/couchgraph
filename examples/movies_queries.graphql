# ─────────────────────────────────────────────────────────────────────────────
# CouchGraph — IMDb Movies Dataset GraphQL Queries & Relational Examples
# Run these in GraphQL Playground (http://localhost:8080) after seeding!
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Typed Relational Query: 1:1 Nested Director Join via DataLoader ──────
# Resolves movies and batches all Director foreign key lookups into _bulk_get
query MoviesWithNestedDirectors {
  movies(minRating: 8.8, limit: 5) {
    id
    title
    year
    rating
    genres
    director {
      id
      name
      nationality
      birthYear
    }
  }
}

# ── 2. Typed Relational Query: 1:N Reverse Filmography via View ─────────────
# Resolves directors and their full list of directed movies via 'by_director_id' view
query DirectorsWithFilmography {
  directors {
    id
    name
    nationality
    knownFor
    movies {
      id
      title
      year
      rating
      boxOfficeUsd
    }
  }
}

# ── 3. Typed Single Document by UUIDv7 ID with Nested Relation ──────────────
query SingleMovieWithDirector($id: ID!) {
  movie(id: $id) {
    title
    year
    rating
    plot
    cast
    director {
      name
      nationality
    }
  }
}

# ── 4. MapReduce View: Exact Single Key Match ───────────────────────────────
# Returns all movies indexed with the exact genre "Drama"
query MoviesByExactGenre {
  queryView(input: {
    designDoc: "movies"
    viewName: "by_genre"
    key: "Drama"
    reduce: false
  }) {
    totalRows
    offset
    rows {
      id
      key
      value
    }
  }
}

# ── 5. MapReduce View: Multi-Key Lookup (keys array) ─────────────────────────
# Returns movies matching any of the specified keys in a single request
query MoviesByMultipleGenres {
  queryView(input: {
    designDoc: "movies"
    viewName: "by_genre"
    keys: ["Sci-Fi", "Crime"]
    reduce: false
  }) {
    totalRows
    rows {
      id
      key
      value
    }
  }
}

# ── 6. MapReduce View: Key Range with Full Document Inclusion ───────────────
# Returns movies released between 1990 and 2005, including full document data
query MoviesByYearRange {
  queryView(input: {
    designDoc: "movies"
    viewName: "by_year"
    startKey: 1990
    endKey: 2005
    reduce: false
    includeDocs: true
  }) {
    totalRows
    offset
    rows {
      id
      key
      value
      doc {
        _id
        _rev
        data
      }
    }
  }
}

# ── 7. MapReduce Reduce View: Aggregated Counts Grouped by Genre ─────────────
# Uses CouchDB built-in '_count' reduce function to count movies per genre
query MovieCountsGroupedByGenre {
  queryView(input: {
    designDoc: "movies"
    viewName: "by_genre"
    reduce: true
    group: true
  }) {
    totalRows
    rows {
      key
      value
    }
  }
}

# ── 8. MapReduce Reduce View: Box Office Statistics Grouped by Genre ────────
# Uses CouchDB built-in '_stats' reduce to compute count, min, max, sum, sumsqr
query BoxOfficeStatsByGenre {
  queryView(input: {
    designDoc: "movies"
    viewName: "box_office_by_genre"
    reduce: true
    group: true
  }) {
    totalRows
    rows {
      key
      value
    }
  }
}

# ── 9. MapReduce Reduce View: Overall Global Ratings Statistics ─────────────
# Overall rating metrics (min, max, average, total count) across all movies
query OverallRatingsStats {
  queryView(input: {
    designDoc: "movies"
    viewName: "ratings_stats"
    reduce: true
    group: false
  }) {
    totalRows
    rows {
      key
      value
    }
  }
}

# ── 10. Mango Query (_find): High-Rated Sci-Fi Movies ────────────────────────
query FindTopSciFiMovies {
  findDocs(input: {
    selector: {
      type: "movie"
      genres: { "$in": ["Sci-Fi"] }
      rating: { "$gte": 8.5 }
    }
    sort: [
      { rating: "desc" }
    ]
    limit: 10
  }) {
    docs {
      _id
      data
    }
    bookmark
  }
}

# ── 11. Batch Fetch by UUIDv7 IDs (DataLoader with single _bulk_get) ─────────
query BatchGetMovies($ids: [ID!]!) {
  documents(ids: $ids) {
    _id
    data
  }
}

# ── 12. Mutation: Insert a New Movie with Auto UUIDv7 ID ────────────────────
mutation AddNewMovie {
  upsertDoc(input: {
    data: {
      type: "movie"
      title: "Oppenheimer"
      year: 2023
      director_id: "01a107be-6492-7538-8ed8-8262766ca648"
      director: "Christopher Nolan"
      genres: ["Biography", "Drama", "History"]
      rating: 8.9
      votes: 750000
      runtime_minutes: 180
      cast: ["Cillian Murphy", "Emily Blunt", "Matt Damon", "Robert Downey Jr."]
      plot: "The story of American scientist J. Robert Oppenheimer and his role in the development of the atomic bomb."
      box_office_usd: 957000000
    }
  }) {
    ok
    _id
    _rev
  }
}
